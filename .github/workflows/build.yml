name: Build Zygisk Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_PLATFORM: android-26

jobs:
  build-module:
    name: Build module (arm64 + arm32)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Fetch dependencies
        run: |
          curl -fsSL -o zygisk.hpp \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
          git clone --depth 1 https://github.com/LSPosed/LSPlt

      - name: Configure + compile arm64-v8a
        run: |
          cmake -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="${{ env.ANDROID_PLATFORM }}" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm64 -j"$(nproc)"

      - name: Configure + compile armeabi-v7a
        run: |
          cmake -B build-arm32 \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM="${{ env.ANDROID_PLATFORM }}" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm32 -j"$(nproc)"

      - name: Assemble module package
        run: |
          mkdir -p out/zygisk
          cp module.prop customize.sh out/
          cp -r webroot META-INF out/
          cp build-arm64/libs/libcodm_tex.so out/zygisk/arm64-v8a.so
          cp build-arm32/libs/libcodm_tex.so out/zygisk/armeabi-v7a.so
          cd out && zip -r ../codm-flat-textures-1.0.0.zip .

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: codm-flat-textures-1.0.0
          path: codm-flat-textures-1.0.0.zip
          if-no-files-found: error
          retention-days: 30
